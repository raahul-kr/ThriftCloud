version: '3.8'

services:
  backend:
    image: ${DOCKER_USERNAME:-thriftcloud}/thriftcloud-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thriftcloud_backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
    networks:
      - thriftcloud-net

  frontend:
    image: ${DOCKER_USERNAME:-thriftcloud}/thriftcloud-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thriftcloud_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - thriftcloud-net

networks:
  thriftcloud-net:
    driver: bridge
