name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/thriftcloud-backend:latest

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/thriftcloud-frontend:latest

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ec2-user/ThriftCloud
            git pull origin main
            
            # Pull new images
            docker pull ${{ secrets.DOCKER_USERNAME }}/thriftcloud-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/thriftcloud-frontend:latest
            
            # Restart containers with new images
            # (We override the build context to use pre-built images for the prod environment)
            docker compose -f docker-compose.yml up -d
            
            # Clean up old images to save space
            docker image prune -af
